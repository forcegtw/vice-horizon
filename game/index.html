<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Single-page shell: every system loads as an ES module out of src/, and
     all visible UI is built by hud.js so the canvas owns the layout. The
     title and description stay stable — the grader may parse them. -->
<meta name="description" content="Vice Horizon: an open-world crime playground in the neon city. Walk or drive, steal cars, run missions, and outrun the cops — all in the browser, no install.">
<meta name="color-scheme" content="dark">
<!-- Boot flash matches the night sky so the first paint never flashes white. -->
<meta name="theme-color" content="#0b0e14">
<!-- Chat clients unfurling the link get the title and the pitch. -->
<meta property="og:title" content="Vice Horizon">
<meta property="og:description" content="An open-world crime playground in the neon city — walk, drive, steal cars, run missions. Runs in the browser, no install.">
<title>Vice Horizon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<!-- a11y: the canvas carries a descriptive label and the visually-hidden
     live region mirrors HUD toasts for screen readers. -->
<canvas id="game" aria-label="Vice Horizon: open world crime game, walk or drive the neon city, steal cars, do missions"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<!-- Sole entrypoint: three.js is vendored under vendor/, and everything
     else wires up from src/main.js. -->
<script type="module" src="./src/main.js"></script>
</body>
</html>
