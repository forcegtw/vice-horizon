<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Witness pass: keep this shell minimal; all UI lives in hud.js so the canvas owns layout. -->
<meta name="description" content="Vice Horizon: an open-world crime playground in the neon city. Walk or drive, steal cars, run missions, and outrun the cops — all in the browser, no install.">
<title>Vice Horizon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice Horizon: open world crime game, walk or drive the neon city, steal cars, do missions"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
