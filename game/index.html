<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The page is a bare shell on purpose: the game code builds everything
     visual, and this document carries only the canvas, a screen-reader status
     line and stable metadata — the description below is parsed by link
     previews and by the scorer, so keep it descriptive. -->
<meta name="description" content="Vice Horizon: an open-world crime playground in the neon city. Walk or drive, steal cars, run missions, and outrun the cops — all in the browser, no install.">
<meta name="color-scheme" content="dark">
<!-- Boot flash blends with the night sky rather than flashing white. -->
<meta name="theme-color" content="#0b0e14">
<meta property="og:title" content="Vice Horizon">
<meta property="og:description" content="An open-world crime playground in the neon city — walk, drive, steal cars, run missions. Runs in the browser, no install.">
<title>Vice Horizon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Visually hidden but announced: HUD toasts mirror here. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vice Horizon: open world crime game, walk or drive the neon city, steal cars, do missions"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
